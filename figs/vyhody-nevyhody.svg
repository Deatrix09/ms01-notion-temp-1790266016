<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="900" height="420" fill="#0f172a"/>
<text x="40" y="40" fill="#f8fafc" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">Simulační metody: výhody × nevýhody</text>
<rect x="40" y="70" width="400" height="320" rx="14" fill="#052e16" stroke="#22c55e" stroke-width="3"/>
<rect x="460" y="70" width="400" height="320" rx="14" fill="#450a0a" stroke="#ef4444" stroke-width="3"/>
<text x="70" y="110" fill="#4ade80" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">✓ Výhody</text>
<text x="490" y="110" fill="#f87171" font-size="22" font-family="DejaVu Sans,sans-serif" font-weight="bold">✗ Nevýhody</text>
<text x="70" y="160" fill="#bbf7d0" font-size="15" font-family="DejaVu Sans,sans-serif">• Cena (crash testy…)</text><text x="70" y="200" fill="#bbf7d0" font-size="15" font-family="DejaVu Sans,sans-serif">• Rychlost (planety, růst…)</text><text x="70" y="240" fill="#bbf7d0" font-size="15" font-family="DejaVu Sans,sans-serif">• Bezpečnost (reakce, epidemie)</text><text x="70" y="280" fill="#bbf7d0" font-size="15" font-family="DejaVu Sans,sans-serif">• Jediný možný způsob</text><text x="70" y="320" fill="#bbf7d0" font-size="15" font-family="DejaVu Sans,sans-serif">• Extrémně složité procesy</text><text x="490" y="160" fill="#fecaca" font-size="15" font-family="DejaVu Sans,sans-serif">• Validita modelu</text><text x="490" y="200" fill="#fecaca" font-size="15" font-family="DejaVu Sans,sans-serif">• Náročnost vytvoření</text><text x="490" y="240" fill="#fecaca" font-size="15" font-family="DejaVu Sans,sans-serif">• Nároky na výkon PC</text><text x="490" y="280" fill="#fecaca" font-size="15" font-family="DejaVu Sans,sans-serif">• Výsledky jen pro sadu parametrů</text><text x="490" y="320" fill="#fecaca" font-size="15" font-family="DejaVu Sans,sans-serif">• Nepřesnost / nestabilita numeriky</text></svg>