<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<rect width="900" height="380" fill="#0f172a"/>
<text x="40" y="40" fill="#f8fafc" font-size="24" font-family="DejaVu Sans,sans-serif" font-weight="bold">Vztahy mezi realitou a modely</text>
<rect x="40" y="90" width="220" height="140" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
<text x="150" y="150" text-anchor="middle" fill="#38bdf8" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">Modelovaný</text>
<text x="150" y="180" text-anchor="middle" fill="#38bdf8" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">systém</text>
<rect x="340" y="90" width="220" height="140" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
<text x="450" y="150" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">Abstraktní</text>
<text x="450" y="180" text-anchor="middle" fill="#a78bfa" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">model</text>
<rect x="640" y="90" width="220" height="140" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
<text x="750" y="150" text-anchor="middle" fill="#34d399" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">Simulační</text>
<text x="750" y="180" text-anchor="middle" fill="#34d399" font-size="20" font-family="DejaVu Sans,sans-serif" font-weight="bold">model</text>
<defs><marker id="a" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/></marker>
<marker id="b" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker></defs>
<line x1="260" y1="160" x2="340" y2="160" stroke="#fbbf24" stroke-width="3" marker-end="url(#a)"/>
<line x1="560" y1="160" x2="640" y2="160" stroke="#22d3ee" stroke-width="3" marker-end="url(#b)"/>
<text x="230" y="270" fill="#fbbf24" font-size="16" font-family="DejaVu Sans,sans-serif" font-weight="bold">homomorfní</text>
<text x="200" y="295" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif">zachová vztahy, jednodušší obraz</text>
<text x="640" y="270" fill="#22d3ee" font-size="16" font-family="DejaVu Sans,sans-serif" font-weight="bold">izomorfní</text>
<text x="600" y="295" fill="#94a3b8" font-size="13" font-family="DejaVu Sans,sans-serif">shodnost struktur a chování</text>
<text x="40" y="350" fill="#e2e8f0" font-size="15" font-family="DejaVu Sans,sans-serif">Simulační model = abstraktní model zapsaný formou programu</text>
</svg>